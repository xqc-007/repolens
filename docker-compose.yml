services:
  backend:
    build: ./backend
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./demo_repo:/app/demo_repo:ro
      - ./workspaces:/app/workspaces
    environment:
      DATABASE_PATH: /app/backend/repolens.db
      WORKSPACE_ROOT: /app/workspaces
      DEMO_REPO_PATH: /app/demo_repo
      LLM_MODE: ${LLM_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
